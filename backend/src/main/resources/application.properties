```properties
# Railway MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:exam_system}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Railway Port Configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-make-it-very-long-and-secure}
jwt.expiration=86400000

# AI Service Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}

# Admin Registration
admin.registration.code=${ADMIN_REGISTRATION_CODE:EXAMPRO-ADMIN-2026}
```